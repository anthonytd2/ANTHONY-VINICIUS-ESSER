<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Velha IA</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f0f0;
        margin: 0;
      }

      h1 {
        color: #333;
      }

      #jogo-tabuleiro {
        display: grid;
        grid-template-columns: repeat(3, 100px);
        grid-template-rows: repeat(3, 100px);
        gap: 5px;
        background-color: #333;
        border: 2px solid #333;
      }

      .celula {
        width: 100px;
        height: 100px;
        background-color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 3em;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .celula:hover {
        background-color: #e9e9e9;
      }

      #reiniciar {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 1.2em;
        cursor: pointer;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 5px;
        transition: background-color 0.3s ease;
      }

      #reiniciar:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <h1>Jogo da Velha com IA (Minimax)</h1>
    <div id="jogo-tabuleiro">
      <div class="celula" id="0"></div>
      <div class="celula" id="1"></div>
      <div class="celula" id="2"></div>
      <div class="celula" id="3"></div>
      <div class="celula" id="4"></div>
      <div class="celula" id="5"></div>
      <div class="celula" id="6"></div>
      <div class="celula" id="7"></div>
      <div class="celula" id="8"></div>
    </div>
    <button id="reiniciar">Reiniciar Jogo</button>

    <script src="jogo.js"></script>
  </body>
</html>
